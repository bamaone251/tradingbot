# Example nginx server block. Adjust server_name and add your own TLS config
# (certbot etc.) - this snippet assumes you already terminate TLS elsewhere
# or will add it here.
#
# This app has NO login system - it only binds to 127.0.0.1, so nginx (and
# whatever access control you put in front of it) is the only thing standing
# between the internet and your trading dashboard. At minimum add HTTP basic
# auth (below) before exposing this beyond localhost.

server {
    listen 80;
    server_name trader.yourdomain.com;

    # --- minimal protection: HTTP basic auth ---
    # 1) sudo apt install apache2-utils
    # 2) sudo htpasswd -c /etc/nginx/.htpasswd yourusername
    # 3) uncomment the two lines below
    # auth_basic "Trading Bot";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
